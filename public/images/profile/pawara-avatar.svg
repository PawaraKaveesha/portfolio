<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#182236"/>
      <stop offset="60%" stop-color="#101522"/>
      <stop offset="100%" stop-color="#080B12"/>
    </radialGradient>
    <linearGradient id="blueOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285FF"/>
      <stop offset="100%" stop-color="#FF8A35"/>
    </linearGradient>
    <linearGradient id="techGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4285FF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FF8A35" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background circle with outer border -->
  <rect width="400" height="400" rx="32" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="398" height="398" rx="31" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Network Grid Background -->
  <g opacity="0.18">
    <line x1="60" y1="60" x2="340" y2="60" stroke="#4285FF" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="60" y1="140" x2="340" y2="140" stroke="#4285FF" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="60" y1="220" x2="340" y2="220" stroke="#4285FF" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="60" y1="300" x2="340" y2="300" stroke="#FF8A35" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="100" y1="40" x2="100" y2="360" stroke="#4285FF" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="200" y1="40" x2="200" y2="360" stroke="#4285FF" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="300" y1="40" x2="300" y2="360" stroke="#FF8A35" stroke-width="1" stroke-dasharray="4 4"/>
  </g>

  <!-- Central Orbital Rings -->
  <circle cx="200" cy="180" r="100" stroke="url(#techGlow)" stroke-width="2" stroke-dasharray="12 6" opacity="0.6"/>
  <circle cx="200" cy="180" r="120" stroke="#4285FF" stroke-width="1" stroke-dasharray="6 8" opacity="0.3"/>

  <!-- Network Nodes -->
  <circle cx="100" cy="140" r="5" fill="#4285FF" filter="url(#glow)"/>
  <line x1="100" y1="140" x2="160" y2="170" stroke="#4285FF" stroke-width="1.5" opacity="0.6"/>
  
  <circle cx="300" cy="140" r="5" fill="#FF8A35" filter="url(#glow)"/>
  <line x1="300" y1="140" x2="240" y2="170" stroke="#FF8A35" stroke-width="1.5" opacity="0.6"/>

  <circle cx="200" cy="70" r="4" fill="#38BDF8"/>
  <line x1="200" y1="70" x2="200" y2="110" stroke="#38BDF8" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- Monogram Shield -->
  <circle cx="200" cy="180" r="65" fill="#131A29" stroke="url(#blueOrange)" stroke-width="2.5" filter="url(#glow)"/>
  
  <!-- Monogram PK Text -->
  <text x="200" y="195" font-family="'Manrope', 'Inter', sans-serif" font-size="44" font-weight="800" fill="#F5F7FA" text-anchor="middle" letter-spacing="2">PK</text>
  
  <!-- Identity Subtext -->
  <rect x="80" y="300" width="240" height="34" rx="17" fill="#101522" stroke="rgba(255,255,255,0.1)"/>
  <circle cx="102" cy="317" r="4" fill="#10B981"/>
  <text x="210" y="322" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#F5F7FA" text-anchor="middle" letter-spacing="0.5">PAWARA KAVEESHA</text>
  
  <text x="200" y="356" font-family="'Inter', sans-serif" font-size="10" font-weight="500" fill="#929BAD" text-anchor="middle" letter-spacing="1">TECH • CREATIVE • LEADERSHIP</text>
</svg>
